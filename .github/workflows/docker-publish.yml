name: Build and Push Multi-Arch Docker Image

# 打 tag 即构建并推送，例如:
#   git tag v1.0.0 && git push origin v1.0.0
# 产物标签: 1.0.0 / 1.0 / latest
#
# 也可以直接在 Actions 页面手动触发，并追加一个自定义标签。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to Docker Hub"
        type: boolean
        default: true
      tag:
        description: "Extra image tag (optional, e.g. test). Defaults to short SHA."
        type: string
        required: false

permissions:
  contents: read

env:
  # 默认推送到 Docker Hub 的 meidlinger1024/ncm-comment-api
  # 如需修改，可在仓库 Settings -> Variables 里增加 DOCKERHUB_REPO
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPO || 'meidlinger1024/ncm-comment-api' }}
  REGISTRY: docker.io
  # 每个平台先推到 IMAGE_NAME-<arch>，最后由 manifest job 合成多架构镜像
  PLATFORMS: linux/amd64,linux/arm64

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.2"

      - name: Resolve dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart test

  # Compile once per architecture, on a runner of that architecture.
  #
  # `dart compile exe` emits a native executable, so the arm64 binary has to be
  # compiled on arm64. Nothing is pushed here: the binaries are handed to the
  # publish job, which builds and pushes one multi-platform image, so Docker Hub
  # only ever sees the one repository.
  compile:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.9.2"

      - name: Resolve dependencies
        run: dart pub get

      - name: Compile the server for ${{ matrix.arch }}
        run: |
          mkdir -p build
          dart compile exe bin/ncm_comment_api.dart -o build/ncm_comment_api-${{ matrix.arch }}
          file build/ncm_comment_api-${{ matrix.arch }}

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: build/ncm_comment_api-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  # Build and push one multi-platform image, the same way the other projects
  # here do it: a single buildx push, so only <IMAGE_NAME> exists on Docker Hub.
  publish:
    needs: [compile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the compiled binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: build
          merge-multiple: true

      - name: Check both binaries are there
        run: ls -la build && file build/ncm_comment_api-*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' || inputs.push }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=ncm-comment-api
            org.opencontainers.image.description=NetEase Cloud Music comment query API built on api-enhanced

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关闭 provenance/SBOM，保持 manifest 简洁、兼容新版 docker pull
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Platforms: \`linux/amd64\`, \`linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
